# A-LLM with the exploration tools and agent features (plan A11, B1, B3, B5). Same model and thresholds.
name: A-LLM-X
model: qwen3.5:9b
max_steps: 15
deny_threshold: 0.8
approve_threshold: 0.8
tools: [read_manifest, read_file, deobfuscate, extract_indicators, inspect_scripts, trace_requires, list_files, trace_flow, search_code, decode_literal, resolve_value, list_endpoints, inspect_binary, file_stats]
self_check: true
guided_reading: true
repeat_limit: 3
options:
  num_ctx: 16384
  temperature: 0
  num_gpu: 99
